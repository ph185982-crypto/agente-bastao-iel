<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Raio-X do Negócio — Nexos Brasil</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --ink:#0E1217;
  --surface:#151B22;
  --surface2:#1C242D;
  --line:rgba(237,232,223,.08);
  --line2:rgba(237,232,223,.14);
  --gold:#E3A93C;
  --gold-soft:rgba(227,169,60,.12);
  --coral:#E76A4E;
  --coral-soft:rgba(231,106,78,.12);
  --jade:#5BC98E;
  --text:#EDE8DF;
  --muted:#8B95A2;
  --muted2:#586470;
  --wa:#25D366;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--ink);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  position:relative;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(1px 1px at 20% 30%, rgba(237,232,223,.18), transparent),
    radial-gradient(1px 1px at 70% 60%, rgba(237,232,223,.12), transparent),
    radial-gradient(1px 1px at 40% 80%, rgba(237,232,223,.10), transparent),
    radial-gradient(1px 1px at 85% 25%, rgba(237,232,223,.14), transparent),
    radial-gradient(1px 1px at 55% 15%, rgba(237,232,223,.10), transparent),
    radial-gradient(1px 1px at 12% 70%, rgba(237,232,223,.12), transparent);
  pointer-events:none;
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(120% 80% at 50% 0%, rgba(227,169,60,.06), transparent 60%);
  pointer-events:none;
}

/* BRAND BAR — mantém o contexto sem custar um clique a mais */
.brand{
  position:fixed;top:0;left:0;right:0;z-index:55;
  display:flex;align-items:center;justify-content:center;
  padding:16px 20px 10px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:500;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold);
  pointer-events:none;
}
.brand.hide{opacity:0;transition:opacity .4s;}

/* PROGRESS */
.progress{
  position:fixed;top:38px;left:0;right:0;z-index:50;
  display:flex;gap:4px;padding:0 20px;
  opacity:0;transition:opacity .4s;
}
.progress.show{opacity:1;}
.seg{
  flex:1;height:3px;border-radius:2px;
  background:var(--line2);overflow:hidden;
}
.seg i{
  display:block;height:100%;width:0;
  background:var(--gold);
  transition:width .5s cubic-bezier(.5,0,.2,1);
}
.seg.done i{width:100%;}

/* STAGE */
.stage{
  position:relative;z-index:1;
  height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.screen{
  position:absolute;
  width:100%;max-width:440px;
  opacity:0;visibility:hidden;
  transform:translateY(16px);
  transition:opacity .5s ease, transform .5s ease, visibility .5s;
  pointer-events:none;
}
.screen.active{
  opacity:1;visibility:visible;transform:translateY(0);
  pointer-events:auto;
}

/* QUESTION */
.q-count{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;font-weight:500;letter-spacing:.1em;
  color:var(--gold);margin-bottom:16px;
}
.q-title{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:600;font-size:clamp(24px,6.2vw,30px);
  line-height:1.15;letter-spacing:-.01em;
  margin-bottom:28px;
}
.options{display:flex;flex-direction:column;gap:10px;}
.opt{
  display:flex;align-items:center;gap:14px;
  padding:18px 18px;
  background:var(--surface);
  border:1px solid var(--line);border-radius:14px;
  cursor:pointer;text-align:left;width:100%;
  font-family:'Inter',sans-serif;font-size:15px;font-weight:400;color:var(--text);
  transition:border-color .2s, background .2s, transform .15s;
}
.opt:active{transform:scale(.99);}
.opt:hover{border-color:var(--line2);background:var(--surface2);}
.opt .key{
  width:30px;height:30px;flex-shrink:0;
  border:1px solid var(--line2);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;
  color:var(--muted);transition:all .2s;
}
.opt:hover .key{border-color:var(--gold);color:var(--gold);}
.opt.sel{border-color:var(--gold);background:var(--gold-soft);}
.opt.sel .key{background:var(--gold);border-color:var(--gold);color:var(--ink);}

/* GRID de segmentos — muitas opções em 2 colunas, sem letra */
.options.grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.options.grid .opt{
  padding:14px 12px;font-size:13.5px;line-height:1.25;
  justify-content:center;text-align:center;gap:0;
  min-height:56px;
}

/* SCANNING */
.scan-wrap{text-align:center;}
.scanner{
  width:160px;height:160px;margin:0 auto 36px;
  position:relative;
}
.scanner svg{width:100%;height:100%;transform:rotate(-90deg);}
.scan-track{fill:none;stroke:var(--line2);stroke-width:2;}
.scan-arc{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:440;stroke-dashoffset:440;
  transition:stroke-dashoffset 2.4s cubic-bezier(.3,0,.2,1);}
.scan-core{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;
  color:var(--gold);text-transform:uppercase;
}
.scan-status{
  font-family:'JetBrains Mono',monospace;font-size:13px;
  color:var(--muted);letter-spacing:.04em;min-height:20px;
}

/* RESULT */
.result{max-width:460px;}
.r-head{text-align:center;margin-bottom:28px;}
.r-eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin-bottom:20px;
}
.gauge{
  width:200px;height:200px;margin:0 auto 16px;position:relative;
}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg);}
.g-track{fill:none;stroke:var(--line2);stroke-width:10;}
.g-arc{fill:none;stroke-width:10;stroke-linecap:round;
  stroke-dasharray:534;stroke-dashoffset:534;
  transition:stroke-dashoffset 1.6s cubic-bezier(.3,0,.2,1);}
.g-core{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;}
.g-num{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
  font-size:58px;line-height:1;letter-spacing:-.02em;}
.g-max{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted2);margin-top:4px;}
.r-tier{
  font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
  font-size:24px;text-align:center;margin-bottom:6px;
}
.r-verdict{font-size:14px;color:var(--muted);text-align:center;line-height:1.6;
  margin-bottom:30px;padding:0 8px;}
.r-verdict b{color:var(--text);font-weight:500;}

.gaps-label{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--coral);margin-bottom:14px;
  display:flex;align-items:center;gap:10px;
}
.gaps-label::after{content:'';flex:1;height:1px;background:var(--line);}
.gap{
  display:flex;gap:13px;align-items:flex-start;
  padding:14px 16px;margin-bottom:8px;
  background:var(--surface);border-radius:12px;
  border-left:2px solid var(--coral);
}
.gap-ico{
  width:18px;height:18px;flex-shrink:0;margin-top:1px;
  color:var(--coral);
}
.gap-txt{font-size:14px;color:var(--text);line-height:1.45;}
.gap-txt span{display:block;font-size:12px;color:var(--muted);margin-top:2px;}

.strengths{margin-top:20px;}
.str{
  display:flex;gap:13px;align-items:center;
  padding:12px 16px;margin-bottom:8px;
  background:rgba(91,201,142,.06);border-radius:12px;
  border-left:2px solid var(--jade);
}
.str-ico{width:16px;height:16px;flex-shrink:0;color:var(--jade);}
.str-txt{font-size:13px;color:var(--muted);}
.str-txt b{color:var(--text);font-weight:500;}

.r-cta-box{
  margin-top:28px;padding:24px 20px;
  background:linear-gradient(160deg, var(--surface2), var(--surface));
  border:1px solid var(--line);border-radius:18px;text-align:center;
}
.r-cta-title{
  font-family:'Bricolage Grotesque',sans-serif;font-weight:600;
  font-size:19px;line-height:1.3;margin-bottom:8px;
}
.r-cta-title em{font-style:normal;color:var(--gold);}
.r-cta-sub{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:20px;}
.btn-wa{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:18px;background:var(--wa);color:#fff;
  border-radius:14px;text-decoration:none;
  font-family:'Inter',sans-serif;font-size:15px;font-weight:600;
  box-shadow:0 8px 30px rgba(37,211,102,.22);
  transition:transform .15s;
}
.btn-wa:active{transform:scale(.98);}
.btn-wa svg{width:20px;height:20px;fill:#fff;}
.wa-note{
  font-size:11px;color:var(--muted2);margin-top:12px;line-height:1.5;
}

.r-foot{
  text-align:center;margin-top:24px;padding-bottom:8px;
  font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.1em;color:var(--muted2);
}

/* scroll for tall screens */
.scroll{
  height:100%;width:100%;overflow-y:auto;
  display:flex;align-items:center;justify-content:center;
  padding:72px 24px 40px;
  -webkit-overflow-scrolling:touch;
}
.scroll::-webkit-scrollbar{display:none;}

.back{
  position:fixed;top:12px;left:16px;z-index:60;
  width:38px;height:38px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);
  display:none;align-items:center;justify-content:center;cursor:pointer;
  color:var(--muted);
}
.back svg{width:18px;height:18px;}
.back.show{display:flex;}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important;}
}
.fadeup{animation:fadeup .5s ease both;}
@keyframes fadeup{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.stagger>*{opacity:0;animation:fadeup .5s ease forwards;}
.stagger>*:nth-child(1){animation-delay:.03s;}
.stagger>*:nth-child(2){animation-delay:.06s;}
.stagger>*:nth-child(3){animation-delay:.09s;}
.stagger>*:nth-child(4){animation-delay:.12s;}
.stagger>*:nth-child(5){animation-delay:.15s;}
.stagger>*:nth-child(6){animation-delay:.18s;}
.stagger>*:nth-child(n+7){animation-delay:.21s;}
</style>
</head>
<body>

<!-- BRAND -->
<div class="brand" id="brand">Nexos Brasil · Diagnóstico</div>

<!-- PROGRESS -->
<div class="progress" id="progress"></div>

<!-- BACK -->
<button class="back" id="back" onclick="goBack()" aria-label="Voltar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
</button>

<div class="stage" id="stage">

  <!-- QUESTIONS -->
  <section class="screen active" id="s-question">
    <div class="scroll">
      <div style="width:100%">
        <div class="q-count" id="qCount"></div>
        <h2 class="q-title" id="qTitle"></h2>
        <div class="options" id="qOptions"></div>
      </div>
    </div>
  </section>

  <!-- SCANNING -->
  <section class="screen" id="s-scan">
    <div class="scan-wrap">
      <div class="scanner">
        <svg viewBox="0 0 160 160">
          <circle class="scan-track" cx="80" cy="80" r="70"/>
          <circle class="scan-arc" id="scanArc" cx="80" cy="80" r="70"/>
        </svg>
        <div class="scan-core">Analisando</div>
      </div>
      <div class="scan-status" id="scanStatus">Cruzando seus dados…</div>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="s-result">
    <div class="scroll">
      <div class="result" style="width:100%">
        <div class="r-head">
          <div class="r-eyebrow">Índice de Presença Digital</div>
          <div class="gauge">
            <svg viewBox="0 0 180 180">
              <circle class="g-track" cx="90" cy="90" r="85"/>
              <circle class="g-arc" id="gArc" cx="90" cy="90" r="85"/>
            </svg>
            <div class="g-core">
              <div class="g-num" id="gNum">0</div>
              <div class="g-max">de 100</div>
            </div>
          </div>
          <div class="r-tier" id="rTier"></div>
          <div class="r-verdict" id="rVerdict"></div>
        </div>

        <div id="gapsBlock">
          <div class="gaps-label">Vulnerabilidades detectadas</div>
          <div id="gapsList"></div>
        </div>

        <div class="strengths" id="strBlock"></div>

        <div class="r-cta-box">
          <div class="r-cta-title" id="ctaTitle"></div>
          <div class="r-cta-sub" id="ctaSub"></div>
          <a class="btn-wa" id="waBtn" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
            <span id="waLabel">Falar com a Nexos agora</span>
          </a>
          <div class="wa-note">Suas respostas já vão na mensagem — é só enviar.</div>
        </div>
        <div class="r-foot">NEXOS BRASIL · GOIÂNIA · MARKETING &amp; VENDAS</div>
      </div>
    </div>
  </section>

</div>

<script>
/* ============ CONFIG ============ */
// >>> WhatsApp comercial da Nexos (só números, com 55 + DDD) <<<
const NEXOS_WHATSAPP = "5562984465388";

/* ============ PERGUNTAS ============ */
const QUESTIONS = [
  {
    id:"segmento", scored:false, grid:true,
    title:"Qual é o seu tipo de negócio?",
    options:[
      {label:"Barbearia"},
      {label:"Salão / Estética"},
      {label:"Academia / Personal"},
      {label:"Clínica / Consultório"},
      {label:"Odontologia"},
      {label:"Restaurante / Bar"},
      {label:"Delivery / Lanchonete"},
      {label:"Moda / Vestuário"},
      {label:"Loja / Varejo"},
      {label:"Imobiliária / Corretor"},
      {label:"Construção / Reforma"},
      {label:"Advocacia"},
      {label:"Contabilidade"},
      {label:"Pet shop / Veterinária"},
      {label:"Cursos / Educação"},
      {label:"Oficina / Automotivo"},
      {label:"Turismo / Eventos"},
      {label:"Outro"}
    ]
  },
  {
    id:"faturamento", scored:false, qualify:true,
    title:"Quanto seu negócio fatura por mês, mais ou menos?",
    options:[
      {k:"A",label:"Até R$ 20 mil", tier:1},
      {k:"B",label:"R$ 20 mil a R$ 40 mil", tier:2},
      {k:"C",label:"R$ 40 mil a R$ 100 mil", tier:3},
      {k:"D",label:"Acima de R$ 100 mil", tier:4}
    ]
  },
  {
    id:"site", scored:true,
    title:"Você tem um site profissional?",
    options:[
      {k:"A",label:"Não tenho site",pts:0,gap:["Sem site profissional","Você não existe pra quem pesquisa no Google."]},
      {k:"B",label:"Tenho, mas é fraco / antigo",pts:1,gap:["Site fraco que não converte","Visita entra e sai sem virar cliente."]},
      {k:"C",label:"Tenho e é bom",pts:3,str:"Site profissional no ar"}
    ]
  },
  {
    id:"google", scored:true,
    title:"Quando alguém busca seu serviço no Google, você aparece?",
    options:[
      {k:"A",label:"Não apareço / não sei",pts:0,gap:["Invisível no Google","Seu concorrente leva o cliente que era seu."]},
      {k:"B",label:"Às vezes apareço",pts:1,gap:["Presença fraca no Google","Você aparece, mas não no topo — onde o clique acontece."]},
      {k:"C",label:"Sempre no topo",pts:3,str:"Bem posicionado no Google"}
    ]
  },
  {
    id:"aquisicao", scored:true,
    title:"Como seus clientes te encontram hoje?",
    options:[
      {k:"A",label:"Só indicação / boca a boca",pts:1,gap:["Dependência de indicação","Sem previsibilidade — mês bom e mês ruim no escuro."]},
      {k:"B",label:"Redes sociais",pts:2,str:"Atrai por redes sociais"},
      {k:"C",label:"Anúncios pagos",pts:3,str:"Já investe em anúncios"},
      {k:"D",label:"Não sei direito",pts:0,gap:["Origem dos clientes desconhecida","Sem saber de onde vêm, é impossível escalar."]}
    ]
  },
  {
    id:"instagram", scored:true,
    title:"Seu Instagram posta com constância?",
    options:[
      {k:"A",label:"Está parado",pts:0,gap:["Instagram parado","Perfil abandonado passa imagem de negócio fechado."]},
      {k:"B",label:"De vez em quando",pts:1,gap:["Instagram inconsistente","Sem ritmo, o algoritmo não entrega e ninguém vê."]},
      {k:"C",label:"Toda semana",pts:2,str:"Instagram ativo"},
      {k:"D",label:"Todo dia",pts:3,str:"Instagram em alta frequência"}
    ]
  },
  {
    id:"metricas", scored:true,
    title:"Você sabe quantos clientes novos vêm da internet por mês?",
    options:[
      {k:"A",label:"Não faço ideia",pts:0,gap:["Resultado não medido","Sem número, todo investimento em marketing é aposta."]},
      {k:"B",label:"Mais ou menos",pts:1,gap:["Métricas vagas","Você sente, mas não controla o que traz cliente."]},
      {k:"C",label:"Sei com precisão",pts:3,str:"Mede resultado com clareza"}
    ]
  }
];

const SCORED = QUESTIONS.filter(q=>q.scored);
const MAX = SCORED.reduce((s,q)=>s+Math.max(...q.options.map(o=>o.pts)),0);

/* ============ STATE ============ */
let qIndex = 0;
const answers = {};

/* ============ PROGRESS ============ */
const progEl = document.getElementById('progress');
QUESTIONS.forEach(()=>{
  const seg=document.createElement('div');seg.className='seg';
  seg.innerHTML='<i></i>';progEl.appendChild(seg);
});
const segs=[...progEl.children];

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const sc=document.getElementById(id).querySelector('.scroll');
  if(sc) sc.scrollTop=0;
}

function renderQuestion(){
  const q=QUESTIONS[qIndex];
  document.getElementById('qCount').textContent=
    `Pergunta ${String(qIndex+1).padStart(2,'0')} / ${String(QUESTIONS.length).padStart(2,'0')}`;
  document.getElementById('qTitle').textContent=q.title;
  const wrap=document.getElementById('qOptions');
  wrap.innerHTML='';
  wrap.className = q.grid ? 'options grid stagger' : 'options stagger';
  q.options.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';
    if(answers[q.id] && answers[q.id].label===o.label) b.classList.add('sel');
    // no grid de segmentos a letra atrapalha a leitura — só o rótulo
    b.innerHTML = q.grid
      ? `<span>${o.label}</span>`
      : `<span class="key">${o.k}</span><span>${o.label}</span>`;
    b.onclick=()=>choose(q,o,b);
    wrap.appendChild(b);
  });
  document.getElementById('back').classList.toggle('show', qIndex>0);
  document.getElementById('brand').classList.remove('hide');
  progEl.classList.add('show');
  void wrap.offsetWidth; // reinicia o stagger
}

function choose(q,o,el){
  answers[q.id]={...o};
  segs[qIndex].classList.add('done');
  document.querySelectorAll('#qOptions .opt').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
  setTimeout(()=>{
    if(qIndex < QUESTIONS.length-1){
      qIndex++;renderQuestion();
      const s=document.getElementById('s-question').querySelector('.scroll');
      if(s)s.scrollTop=0;
    } else {
      runScan();
    }
  },260);
}

function goBack(){
  if(qIndex>0){
    segs[qIndex].classList.remove('done');
    qIndex--;
    renderQuestion();
    showScreen('s-question');
  }
}

/* ============ SCAN ============ */
function runScan(){
  showScreen('s-scan');
  document.getElementById('back').classList.remove('show');
  // barra de marca e progresso saem: do scan em diante a tela é só do resultado
  document.getElementById('brand').classList.add('hide');
  progEl.classList.remove('show');
  const arc=document.getElementById('scanArc');
  void arc.offsetWidth;
  arc.style.strokeDashoffset='0';
  const msgs=["Cruzando seus dados…","Comparando com o seu mercado…","Calculando pontos de vazamento…","Montando seu plano de ação…"];
  let i=0;const st=document.getElementById('scanStatus');
  st.textContent=msgs[0];
  const iv=setInterval(()=>{i++;if(i<msgs.length){st.textContent=msgs[i];}},650);
  setTimeout(()=>{clearInterval(iv);reveal();},2600);
}

/* ============ RESULT ============ */
function computeResult(){
  let raw=0;const gaps=[];const strengths=[];
  SCORED.forEach(q=>{
    const a=answers[q.id];if(!a)return;
    raw+=a.pts;
    if(a.gap)gaps.push(a.gap);
    if(a.str)strengths.push(a.str);
  });
  const score=Math.round(raw/MAX*100);
  return {score,gaps,strengths};
}

function tierInfo(score){
  if(score<=40) return {
    name:"Estado Crítico", color:"var(--coral)",
    verdict:"Seu negócio está <b>perdendo clientes todos os dias</b> pra quem aparece primeiro. A boa notícia: o que está quebrado tem conserto rápido — e o salto é grande.",
    ctaT:'Cada dia assim <em>custa caro.</em>',
    ctaS:"Vamos montar seu plano de virada. Chama no WhatsApp e receba os 3 primeiros passos — sem compromisso."
  };
  if(score<=70) return {
    name:"Em Risco", color:"var(--gold)",
    verdict:"Sua base existe, mas há <b>vazamentos claros</b> deixando dinheiro na mesa. Com ajuste certo, dá pra destravar um fluxo bem maior de clientes.",
    ctaT:'Você está perto. <em>Falta o sistema.</em>',
    ctaS:"Te mostramos exatamente o que ajustar pra transformar presença em cliente. Chama no WhatsApp e receba seu plano."
  };
  return {
    name:"Bem Posicionado", color:"var(--jade)",
    verdict:"Você está <b>acima da média</b> do seu mercado. Agora o jogo é otimização e escala — extrair o máximo do que já funciona.",
    ctaT:'Hora de <em>escalar.</em>',
    ctaS:"Negócios nesse nível crescem rápido com a estratégia certa. Vamos conversar sobre como multiplicar seus resultados."
  };
}

function reveal(){
  const {score,gaps,strengths}=computeResult();
  const t=tierInfo(score);

  document.getElementById('rTier').textContent=t.name;
  document.getElementById('rTier').style.color=t.color;
  document.getElementById('rVerdict').innerHTML=t.verdict;
  document.getElementById('gArc').style.stroke=t.color;
  document.getElementById('ctaTitle').innerHTML=t.ctaT;
  document.getElementById('ctaSub').textContent=t.ctaS;

  // gaps
  const gl=document.getElementById('gapsList');gl.innerHTML='';
  if(gaps.length===0){document.getElementById('gapsBlock').style.display='none';}
  else{
    document.getElementById('gapsBlock').style.display='';
    gaps.forEach(g=>{
      const d=document.createElement('div');d.className='gap';
      d.innerHTML=`<svg class="gap-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div class="gap-txt">${g[0]}<span>${g[1]}</span></div>`;
      gl.appendChild(d);
    });
  }

  // strengths
  const sb=document.getElementById('strBlock');sb.innerHTML='';
  if(strengths.length){
    strengths.forEach(s=>{
      const d=document.createElement('div');d.className='str';
      d.innerHTML=`<svg class="str-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
        <div class="str-txt"><b>${s}</b></div>`;
      sb.appendChild(d);
    });
  }

  // WhatsApp já com todas as respostas do questionário
  document.getElementById('waBtn').href=buildWhatsApp(score,t.name,gaps);

  showScreen('s-result');

  setTimeout(()=>{
    const arc=document.getElementById('gArc');
    arc.style.strokeDashoffset = 534-(534*score/100);
    countUp(score);
  },300);
}

function countUp(target){
  const el=document.getElementById('gNum');let cur=0;
  const step=Math.max(1,Math.round(target/40));
  const iv=setInterval(()=>{cur+=step;if(cur>=target){cur=target;clearInterval(iv);}el.textContent=cur;},32);
}

function buildWhatsApp(score,tier,gaps){
  const val = id => (answers[id] && answers[id].label) || "-";
  const billingTier = (answers.faturamento && answers.faturamento.tier) || 0;
  // Lead de alto faturamento com baixa maturidade digital = maior urgência de atendimento
  const isPriority = billingTier>=3 && score<=70;
  let msg = isPriority ? `🔥 *LEAD PRIORITÁRIO*\n\n` : '';
  msg += `Olá! Vim pelo site da Nexos e acabei de fazer o diagnóstico do meu negócio.\n\n`;
  msg += `*Meu resultado*\n`;
  msg += `Índice de Presença Digital: ${score}/100 (${tier})\n\n`;
  msg += `*Meu negócio*\n`;
  msg += `Segmento: ${val('segmento')}\n`;
  msg += `Faturamento mensal: ${val('faturamento')}\n\n`;
  msg += `*O que respondi*\n`;
  msg += `Site profissional: ${val('site')}\n`;
  msg += `Aparece no Google: ${val('google')}\n`;
  msg += `Como os clientes me encontram: ${val('aquisicao')}\n`;
  msg += `Constância no Instagram: ${val('instagram')}\n`;
  msg += `Mede clientes vindos da internet: ${val('metricas')}\n`;
  if(gaps.length){
    msg += `\n*Vulnerabilidades apontadas*\n`;
    gaps.forEach(g=>{msg+=`• ${g[0]}\n`;});
  }
  msg += `\nQuero receber meu plano de ação.`;
  return `https://wa.me/${NEXOS_WHATSAPP}?text=${encodeURIComponent(msg)}`;
}

progEl.classList.add('show');
renderQuestion();
