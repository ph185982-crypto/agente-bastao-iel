# Worker de edição de vídeo (reels): a cada 5 minutos pega os vídeos que o Pedro enviou (fila em /api/videos),
# edita com ffmpeg + faster-whisper + OpenCV (tools/reels/editar.py) e devolve final.mp4 + poster.jpg para aprovação.
# Também roda na hora quando o app dispara `repository_dispatch` (type: video) ou manualmente (workflow_dispatch).
# Nada é publicado no Instagram daqui: o resultado entra na fila de aprovação do app.
# Configurações (Settings → Secrets and variables → Actions):
#   • Variável  MONITOR_URL     = endereço de PRODUÇÃO do app, sem barra no fim (sem ela, usa o endereço padrão)
#   • Nenhum segredo é obrigatório: o editor usa o token OIDC do GitHub Actions (backend/lib/githubOidc.js) e o b-roll vem pelo app.
#   • Secrets opcionais: CRON_SECRET e PEXELS_API_KEY.
name: Worker de vídeo (reels)
on:
  schedule:
    - cron: '*/15 * * * *'   # reforço: o agendamento do GitHub atrasa muito; o plantão abaixo é quem atende de verdade
  workflow_dispatch: {}
  repository_dispatch:
    types: [video]
  push:
    branches: [main]
    paths: ['tools/reels/**', '.github/workflows/video-worker.yml']   # ao publicar uma mudança, o plantão recomeça
permissions:
  contents: read
  id-token: write   # o editor se identifica ao app com o token OIDC do runner: não precisa de segredo cadastrado
  actions: write    # para se reiniciar ao fim do plantão (o GITHUB_TOKEN pode disparar workflow_dispatch)
concurrency: { group: video-worker, cancel-in-progress: false }
jobs:
  editar:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache do pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-reels-${{ runner.os }}-${{ hashFiles('tools/reels/requirements.lock') }}

      - name: Cache do modelo do Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-reels-${{ runner.os }}-v1

      - name: Instalar ffmpeg (já vem com libass)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -version | head -1

      - name: Instalar dependências Python
        run: python3 -m pip install --quiet -r tools/reels/requirements.lock

      - name: Instalar @vercel/blob (isolado; o npm ci do app inteiro é pesado demais para este job)
        run: |
          VERSAO=$(node -p "require('./package.json').dependencies['@vercel/blob']")
          mkdir -p "$RUNNER_TEMP/worker" && cd "$RUNNER_TEMP/worker"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --silent "@vercel/blob@${VERSAO}"
          echo "NODE_PATH=$RUNNER_TEMP/worker/node_modules" >> "$GITHUB_ENV"

      - name: Editar os vídeos da fila (plantão de até 5h45)
        id: editar
        env:
          WORKER_MINUTOS: '345'
          WORKER_INTERVALO_S: '30'
          APP_URL: ${{ vars.MONITOR_URL || 'https://agente-bastao-iel.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}        # opcional: sem ele vale o token OIDC do runner
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}  # opcional: sem ele o b-roll vem pelo app
        run: node tools/reels/worker.js

      # Recomeça o plantão (uma nova execução entra na fila do `concurrency` e começa quando esta terminar).
      - name: Reiniciar o plantão
        if: ${{ always() && steps.editar.outputs.recorrer == 'sim' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run video-worker.yml --ref main || echo "não consegui reiniciar; o reforço de 15 minutos retoma"
