[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy API calls → Vercel backend
[[redirects]]
  from   = "/api/*"
  to     = "https://nexos-paginas-api.vercel.app/api/:splat"
  status = 200
  force  = true

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
