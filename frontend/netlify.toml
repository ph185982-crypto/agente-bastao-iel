[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy API calls → Fly.io backend (substitui Render)
[[redirects]]
  from   = "/api/*"
  to     = "https://nexos-paginas-backend.fly.dev/api/:splat"
  status = 200
  force  = true

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
