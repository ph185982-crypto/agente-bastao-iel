<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nexos Páginas</title>
    <meta name="description" content="Studio de conteúdo viral: reels, carrosséis e boas notícias" />

    <!-- PWA / instalação -->
    <meta name="theme-color" content="#0b1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexos" />

    <!-- Ícones iOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- OneSignal Push Notifications -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        const appId = document.querySelector('meta[name="onesignal-app-id"]')?.content;
        if (!appId || appId === 'SEU_APP_ID_AQUI') return;
        await OneSignal.init({ appId, notifyButton: { enable: false }, allowLocalhostAsSecureOrigin: true });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
