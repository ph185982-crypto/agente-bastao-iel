# Identidade visual e parametros dos templates (lido por fazer_reels.py e mapa.py)

video:
  largura: 1080
  altura: 1920
  fps: 30
  bitrate: 10M          # alvo 8 a 12 Mbps

cores:
  destaque: "#0052FF"   # cor da marca
  verde_foco: "#3CFF6E" # rota/elemento em foco
  rota: "#FFFFFF"       # rotas na explicacao
  texto: "#FFFFFF"
  fundo: "#0A1B33"      # quando nao ha mapa
  previa: ["#FFD23F", "#FF4FA3", "#2EE6FF", "#FFFFFF"]  # malha do gancho, por categoria

fonte:
  arquivo: fontes/Montserrat-BoldItalic.ttf
  familia: Montserrat

legenda:
  tamanho: 66           # px em 1080 de largura
  posicao_y: 0.76       # centro da legenda, fracao da altura (como na referencia)
  palavras_min: 2
  palavras_max: 5
  sombra: 3

rotulo:
  tamanho: 32           # minimo da barra: 28 px
  raio: 10

zona_segura:
  topo: 220
  base: 280

mapa:
  base: dados/base      # piramide de tiles gerada por mapa.py a partir da NASA Blue Marble
  lon0: -86.0           # recorte (graus): America do Sul inteira, como na referencia
  lat0: 14.0
  lon1: -28.0
  lat1: -57.0
  px_por_grau: 240      # resolucao da Blue Marble NG (~500 m/pixel)
  espessura_rota: 4.5
  brilho_rota: 14
  deriva_zoom: 0.012    # empurrao lento por segundo: o mapa nunca fica parado
  transicao_camera: 1.4 # segundos de movimento entre enquadramentos

audio:
  whoosh_db: -26        # whoosh sintetizado nas trocas de camera

fluxo:                  # template "A Conta"
  fonte_texto: fontes/Montserrat-VF.ttf
  fundo: "#0A1B33"
  verde: "#00C853"
  vermelho: "#FF3B30"
  som_db: -34           # efeitos ~18 dB abaixo da voz (-16 LUFS), com ducking na fala
  cores:
    produto: "#8FA3BF"  # cinza-azulado
    comissao: "#FF3B30"
    frete: "#FFB800"
    imposto: "#7E3FF2"
    anuncio: "#38B1FF"
  nomes:
    produto: Produto
    comissao: Comissão
    frete: Frete
    imposto: Imposto
    anuncio: Anúncio
  grade: {colunas: 10, celula: 50, espaco: 6, x0: 30, y0: 610}
  chip: {x: 600, largura: 452, altura: 104, espaco: 12}
  valor_px: 104         # contador de saldo (minimo da barra: 48 px para valores)
  texto_px: 50          # texto-na-tela
